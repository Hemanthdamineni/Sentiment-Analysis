[workspace]
authors = ["Hemanth Damineni <hemanthdamineni@gmail.com>"]
name = "sentiment-analysis"
version = "0.1.0"

channels = ["pytorch", "conda-forge"]
platforms = ["win-64", "linux-64"]

[tasks]
pipeline = "python backend/main.py --train --evaluate --use_huggingface"
train = "python backend/main.py --train --use_huggingface"
evaluate = "python backend/main.py --evaluate --use_huggingface"
backend = "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
test = "PYTHONPATH=. pytest tests/ -v"
[dependencies]
# Core
python = "3.11.*"

# Backend
fastapi = "*"
uvicorn = "*"
pydantic-settings = "*"

# PyTorch (CPU ONLY, pinned)
pytorch = { version = "2.2.*", build = "*cpu*" }

# NLP (SAFE RANGE — avoids openssl conflicts)
transformers = "4.44.*"
datasets = "2.18.*"

# Data
numpy = "*"
pandas = "*"
scikit-learn = "*"

# Visualization (NO GUI backend)
matplotlib-base = "3.8.*"
seaborn = "*"

# NLP utils
nltk = "*"
textblob = "*"

# Utils
tqdm = "*"
pip = "*"
python-dotenv = "*"
wordcloud = "*"
imbalanced-learn = "*"
python-multipart = "*"

# Testing
pytest = "*"
pytest-asyncio = "*"
httpx = "*"
